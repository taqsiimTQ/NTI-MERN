<!DOCTYPE html>
<html>
<head>
    <title>API</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f4f4f9;
            padding: 30px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .header-panel {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }
        
        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: white;
        }
        
        #btn-get {
            background-color: #3498db;
        }
        
        #btn-post {
            background-color: #2ecc71;
        }
        
        #btn-put {
            background-color: #f39c12;
        }
        
        #btn-delete {
            background-color: #e74c3c;
        }
        
        #output {
            margin-top: 10px;
            min-height: 150px;
        }
        
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .card {
            background: white;
            border: 1px solid #e1e8ed;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        
        .card h4 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        
        .card p {
            color: #555;
            font-size: 0.95em;
            flex-grow: 1;
        }
        
        .card-footer {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-panel">
            <h1>test api</h1>
            <div class="button-group">
                <button id="btn-get">GET</button>
                <button id="btn-post">POST</button>
                <button id="btn-put">PUT</button>
                <button id="btn-delete">DEL</button>
            </div>
        </div>
        <div id="output">
            <p>results...</p>
        </div>
    </div>
    
    <script type="module" src="app.js"></script>
</body>
</html>
