<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTI Mini Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>NTI Mini Store</h1>
        
        <!-- Stats Section -->
        <div class="stats-card">
            <h3>Store Statistics</h3>
            <div id="statsDisplay"></div>
        </div>

        <!-- Add/Edit Product Form -->
        <div class="form-card">
            <h3 id="formTitle">Add Product</h3>
            <form id="productForm">
                <input type="hidden" id="productId">
                <div class="form-group">
                    <label for="name">Product Name:</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="price">Price:</label>
                    <input type="number" id="price" min="0" step="any" required>
                </div>
                <div class="form-group">
                    <label for="category">Category:</label>
                    <input type="text" id="category" required>
                </div>
                <div class="form-group">
                    <label for="quantity">Quantity:</label>
                    <input type="number" id="quantity" min="0" required>
                </div>
                <button type="submit" id="submitBtn">Add Product</button>
                <button type="button" id="cancelBtn" style="display: none;">Cancel</button>
            </form>
        </div>

        <!-- Controls Section -->
        <div class="controls-card">
            <h3>Controls</h3>
            <div class="control-group">
                <input type="text" id="searchInput" placeholder="Search by name or category...">
            </div>
            <div class="control-group">
                <input type="number" id="minPrice" placeholder="Min Price">
                <input type="number" id="maxPrice" placeholder="Max Price">
                <button id="filterPriceBtn">Filter by Price</button>
            </div>
            <div class="control-group">
                <select id="sortSelect">
                    <option value="">Sort by...</option>
                    <option value="asc">Price (Low to High)</option>
                    <option value="desc">Price (High to Low)</option>
                </select>
            </div>
        </div>

        <!-- Products Table -->
        <div class="table-card">
            <h3>Products</h3>
            <table id="productsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Category</th>
                        <th>Quantity</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="productsBody">
                    <!-- Products will be injected here -->
                </tbody>
            </table>
        </div>

        <!-- Categories Grouping -->
        <div class="categories-card">
            <h3>Products by Category</h3>
            <div id="categoriesDisplay"></div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
